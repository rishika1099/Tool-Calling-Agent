<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 108 960 440" width="960" height="440" role="img" aria-labelledby="ll-arch-title ll-arch-desc">
<title id="ll-arch-title">Layer Lab architecture</title>
<desc id="ll-arch-desc">The browser page posts chat messages to FastAPI endpoints on Cloud Run. The run_agent loop sends the conversation and tool schemas to Gemini on Vertex AI, which returns tool calls. The loop runs tools, which read and write session state, read clothing warmth tables, and call Open-Meteo and the National Weather Service.</desc>
